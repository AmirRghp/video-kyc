# Development overrides — hot reload + exposed ports
services:
  ai:
    ports:
      - "8001:8001"
    volumes:
      - ./services/ai/src:/app/src:ro
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8001", "--app-dir", "/app/src", "--reload"]

  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./services/backend/src:/app/src:ro
      - ./services/backend/uploads:/app/uploads
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "/app/src", "--reload"]

  frontend:
    ports:
      - "3000:80"
    volumes:
      - ./services/frontend/src/index.html:/usr/share/nginx/html/index.html:ro
      - ./services/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
